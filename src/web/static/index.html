<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>데스크 셋업 시뮬레이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--accent:#1f5eff;--ink:#15171c;--sub:#6b7078;--line:#e7e4de;--bg:#f4f4f2;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:350px 1fr;height:100vh}
.panel{overflow:auto;background:#fff;border-right:1px solid var(--line);padding:24px 20px 48px}
.panel header h1{font-size:21px;font-weight:800;margin:0;letter-spacing:-.02em}
.panel header p{margin:6px 0 0;color:var(--sub);font-size:13px}
section{border-top:1px solid var(--line);margin-top:18px;padding-top:16px}
section h3{margin:0 0 10px;font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--accent)}
.row{margin:0 0 14px}
.row.hide{display:none}
.lab{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:500;margin-bottom:7px;gap:8px}
.val{display:flex;align-items:center;gap:4px;color:var(--sub);font-size:12px}
.num{width:64px;border:1px solid var(--line);border-radius:7px;padding:4px 6px;font:inherit;font-size:13px;font-weight:700;color:var(--ink);text-align:right;background:#fafaf8}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.chips,.seg{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.seg{margin-top:0}
.chips button,.seg button{border:1px solid var(--line);background:#fafaf8;border-radius:8px;padding:5px 9px;font-size:12px;font-weight:500;transition:.15s}
.seg button{flex:1 1 auto;padding:7px 8px}
.chips button.on,.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
select{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;font-size:13px;background:#fafaf8}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:28px;height:28px;border-radius:50%;background:var(--c);border:1px solid rgba(0,0,0,.15);position:relative}
.sw button.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent)}
.tg{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:500;cursor:pointer}
.tg input{display:none}
.tg i{width:40px;height:23px;border-radius:99px;background:#d4d4d0;position:relative;transition:.2s;flex:none}
.tg i:after{content:'';position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tg input:checked+i{background:var(--accent)}
.tg input:checked+i:after{left:20px}
.slots{display:grid;grid-template-columns:1fr;gap:7px}
.slot{display:flex;gap:6px;align-items:stretch}
.slot .load{flex:1;text-align:left;border:1px solid var(--line);background:#fafaf8;border-radius:9px;padding:8px 10px;font-size:12px}
.slot .load b{color:var(--accent);margin-right:6px}
.slot .load.empty{color:#aaa}
.slot .save{border:1px solid var(--line);background:#fff;border-radius:9px;padding:0 11px;font-size:12px;font-weight:700}
.xd{border:1px solid var(--line);border-radius:12px;padding:12px 12px 2px;margin-bottom:10px;background:#fcfcfa}
.xh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px}
.xh b{font-weight:800}
.del{border:0;background:none;color:var(--bad);font-size:12px;font-weight:700;padding:2px 4px}
.xd .seg{margin-bottom:12px}
.sw.sm button{width:22px;height:22px}
.add{width:100%;border:1px dashed #b5c4f4;background:#f5f8ff;color:var(--accent);border-radius:10px;padding:10px;font-weight:700;font-size:13px}
.note{font-size:11.5px;color:var(--sub);line-height:1.55;margin-top:8px}

.stage{position:relative;padding:18px 20px 18px;display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
.view{position:relative;flex:1;min-height:300px;border-radius:22px;overflow:hidden;background:radial-gradient(120% 90% at 50% 20%,#f7f3ec 0%,#f1eae0 70%,#ece4d8 100%);border:1px solid #e9e2d7}
.view canvas{display:block;width:100%;height:100%;touch-action:none}
.card{position:absolute;top:22px;left:22px;background:rgba(255,255,255,.93);padding:13px 20px 12px;border-left:4px solid var(--accent);box-shadow:0 2px 14px rgba(40,30,10,.06);pointer-events:none}
.card.r{left:auto;right:22px;border-left:0;border-right:4px solid var(--accent);text-align:right}
.card b{font-size:22px;font-weight:700;letter-spacing:-.01em;display:block}
.card small{display:block;letter-spacing:.07em;color:var(--sub);font-weight:700;font-size:11.5px;margin-top:4px}
.hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(55,55,55,.82);color:#fff;padding:9px 18px;border-radius:99px;font-weight:700;font-size:13px;transition:opacity .6s;pointer-events:none;white-space:nowrap}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.views{display:flex;gap:5px;flex-wrap:wrap}
.views button,.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 13px;font-size:13px;font-weight:700}
.views button.on{border-color:var(--accent);color:var(--accent)}
.spacer{flex:1}
.bar .tg{gap:10px;font-weight:700}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.ck{background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 12px;position:relative}
.ck .t{font-size:11.5px;color:var(--sub);font-weight:700;display:flex;align-items:center;gap:6px}
.ck .t:before{content:'';width:8px;height:8px;border-radius:50%;background:var(--c,#bbb);flex:none}
.ck .v{font-size:16px;font-weight:800;margin-top:3px;letter-spacing:-.01em}
.ck .n{font-size:11.5px;color:var(--sub);margin-top:2px;line-height:1.45}
.ck.ok{--c:var(--ok)} .ck.warn{--c:var(--warn)} .ck.bad{--c:var(--bad)} .ck.info{--c:var(--accent)}
.err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:14px;text-align:center;padding:20px}

@media (max-width:880px){
  html,body{height:100%;overflow:hidden}
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);height:100vh;height:100dvh}
  .stage{order:-1;padding:8px 8px 6px;gap:6px;background:var(--bg);border-bottom:1px solid var(--line);box-shadow:0 4px 12px rgba(0,0,0,.04);z-index:2}
  .view{height:42vh;height:42dvh;min-height:210px;flex:none;border-radius:16px}
  .card{top:10px;left:10px;padding:7px 11px 6px;border-left-width:3px}
  .card.r{right:10px;border-right-width:3px}
  .card b{font-size:14px}
  .card small{font-size:9.5px;margin-top:2px}
  .hint{font-size:11px;bottom:10px;padding:7px 13px}
  .bar{flex-wrap:nowrap;overflow-x:auto;gap:6px;scrollbar-width:none}
  .bar::-webkit-scrollbar,.checks::-webkit-scrollbar{display:none}
  .views{flex-wrap:nowrap}
  .views button,.btn{padding:6px 10px;font-size:12px;white-space:nowrap;flex:none}
  .spacer{display:none}
  .bar .tg{flex:none;white-space:nowrap;font-size:12px;gap:6px}
  .bar .tg i{width:34px;height:20px}
  .bar .tg i:after{width:14px;height:14px}
  .bar .tg input:checked+i:after{left:17px}
  .checks{display:flex;overflow-x:auto;gap:6px;scrollbar-width:none}
  .ck{min-width:150px;flex:none;padding:6px 10px;border-radius:10px}
  .ck .t{font-size:10.5px}
  .ck .v{font-size:13px;margin-top:1px}
  .ck .n{display:none}
  .panel{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-right:0;padding:14px 16px 80px}
  .panel header h1{font-size:17px}
}
@media (max-width:950px) and (orientation:landscape) and (max-height:520px){
  .app{grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:1fr}
  .stage{order:0;border-bottom:0;border-right:1px solid var(--line);min-height:0}
  .view{height:auto;flex:1;min-height:0}
  .checks{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <header>
      <h1>데스크 셋업 시뮬레이터</h1>
      <p>모든 물체는 실제 mm 치수로 그려져요.</p>
    </header>
    <div id="controls"></div>
    <section>
      <h3>비교용 저장</h3>
      <div class="slots" id="slots"></div>
      <div class="note">현재 설정을 슬롯에 저장해 두고 눌러서 바로 바꿔 보세요. 이 브라우저에만 저장돼요.</div>
    </section>
    <section>
      <h3>가정한 값</h3>
      <div class="note">눈 위치는 책상 앞 끝에서 12cm 뒤, 앉은 자세는 팔꿈치가 책상 높이에 오도록 의자를 맞췄다고 가정했어요(책상 높이 900mm 이상이면 서 있는 자세). 권장 시청 거리는 화면 세로 길이의 2.0~2.6배로 계산해요.</div>
    </section>
  </aside>

  <main class="stage">
    <div class="view" id="view">
      <div class="card l"><b id="cDesk">–</b><small id="cDeskS">DESK</small></div>
      <div class="card r"><b id="cMon">–</b><small id="cMonS">MONITOR</small></div>
      <div class="hint" id="hint">드래그하여 회전 · 스크롤하여 확대</div>
    </div>
    <div class="bar">
      <div class="views" id="views">
        <button data-v="iso" class="on">사선</button>
        <button data-v="front">정면</button>
        <button data-v="top">위에서</button>
        <button data-v="side">옆</button>
        <button data-v="pov">앉은 시점</button>
      </div>
      <div class="spacer"></div>
      <label class="tg"><span>자동 회전</span><input type="checkbox" id="auto"><i></i></label>
      <button class="btn" id="reset">↺ 시점 초기화</button>
    </div>
    <div class="checks" id="checks"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

function labelSprite(text){

  x.font=`800 ${fs}px "Noto Sans KR",sans-serif`;const tw=x.measureText(text).width;
  c.width=Math.ceil(tw+56);c.height=96;x.font=`800 ${fs}px "Noto Sans KR",sans-serif`;

  x.beginPath();x.roundRect?x.roundRect(3,3,c.width-6,90,18):x.rect(3,3,c.width-6,90);x.fill();x.stroke();
  x.fillStyle='#1f5eff';x.textBaseline='middle';x.textAlign='center';x.fillText(text,c.width/2,50);

  const mat=MATS[S.mat];const surf=H+(mat?3:0);
  let kb=null,kbZ=D/2-90,kbLeft=0,mouseRight=0;
  if(S.kb!=='none'){kb=buildKeyboard(S.kb,S.theme);kbZ=D/2-90-kb.d/2;kb.g.position.set(0,surf,kbZ);items.add(kb.g);kbLeft=-kb.w/2;mouseRight=kb.w/2}
  if(S.mouse){const mx=kb?kb.w/2+65+33:180;const mo=buildMouse(S.theme);mo.position.set(mx,surf,kb?kbZ:D/2-170);items.add(mo);mouseRight=mx+33}
  if(mat){
    const [mw,md]=mat;const cx=kb||S.mouse?(kbLeft+mouseRight)/2:0;
    const m=slab(mw,md,3,14,M(S.matColor,{r:.95}));m.position.set(cx,H,Math.max(-D/2+md/2,D/2-30-md/2));items.add(m);
  }

  /* extras */
  let leftEdge=sideBox.min.x,rightEdge=sideBox.max.x;
  if(S.speakers){
    for(const s of[-1,1]){const sp=buildSpeaker(S.theme);const x=(s<0?sideBox.min.x:sideBox.max.x)+s*(55+45);sp.position.set(x,H,mainZ-10);sp.rotation.y=-s*.25;items.add(sp)}
    leftEdge-=145;rightEdge+=145;
  }
  if(S.laptop!=='none'){
    const lp=buildLaptop(S.laptop);const x=leftEdge-50-lp.w/2;const z=Math.min(mainZ+lp.d/2-10,D/2-lp.d/2-20);
    lp.g.position.set(x,H,z);lp.g.rotation.y=.18;items.add(lp.g);
  }
  if(S.tower==='deskL'||S.tower==='deskR'){const s=S.tower==='deskL'?-1:1;const t=buildTower(-s);t.position.set(s*(W/2-50-115),H,-D/2+30+230);items.add(t)}
  if(S.tower==='floor'){const t=buildTower(-1);t.position.set(W/2-260,0,0);extra.add(t)}
  if(S.chair){const ch=buildChair(Math.round(.255*S.userH*10));ch.position.set(0,0,D/2+290);extra.add(ch)}

  S.sets.forEach(e=>extra.add(buildSet(e,deskCtx(e.desk))));
  S.pegs.forEach(e=>extra.add(buildPeg(e,deskCtx(e.desk))));
  const dGroups=S.drawers.map(e=>{const dg=buildDrawer(e);const p=placeDrawer(e);dg.position.set(p.x,0,p.z);dg.rotation.y=p.r;extra.add(dg);return {dg,e}});
  root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
  roomG.traverse(o=>{if(o.isMesh)o.castShadow=false});
  {const sz=room?Math.max(4200,Math.max(S.roomW,S.roomD)*.75+Math.abs(S.roomX)):4200;Object.assign(sun.shadow.camera,{left:-sz,right:sz,top:sz,bottom:-sz,far:12000});sun.shadow.camera.updateProjectionMatrix()}

  /* dims */
  if(S.dims){
    dimLine(dims,V(-W/2,H+2,D/2+80),V(W/2,H+2,D/2+80),`${W}`);
    dimLine(dims,V(W/2+80,H+2,-D/2),V(W/2+80,H+2,D/2),`${D}`);
    dimLine(dims,V(W/2+80,0,D/2+80),V(W/2+80,H,D/2+80),`H ${H}`);
    const span=Math.round(monBox.max.x-monBox.min.x);
    dimLine(dims,V(monBox.min.x,monBox.max.y+70,mainZ),V(monBox.max.x,monBox.max.y+70,mainZ),`모니터 ${span}`);
    for(const {xg,e} of xGroups){const dg=new THREE.Group();dg.position.copy(xg.position);dg.rotation.copy(xg.rotation);dims.add(dg);
      dimLine(dg,V(-e.w/2,e.h+2,e.d/2+80),V(e.w/2,e.h+2,e.d/2+80),`${e.w}`);dimLine(dg,V(-e.w/2-80,e.h+2,-e.d/2),V(-e.w/2-80,e.h+2,e.d/2),`${e.d}`);}
    for(const {dg,e} of dGroups){const s=labelSprite(`${e.w}×${e.d}×${e.h}`);s.position.set(dg.position.x,e.h+(e.where.startsWith('under')?-60:70),dg.position.z+(/^F?L/.test(e.where)?0:e.d/2));dims.add(s)}
    if(room){dimLine(dims,V(room.xl,8,room.zf-60),V(room.xr,8,room.zf-60),`방 ${S.roomW}`);dimLine(dims,V(room.xl+60,8,room.zb),V(room.xl+60,8,room.zf),`${S.roomD}`)}
    dimLine(dims,V(-W/2+70,H+4,mainZ),V(-W/2+70,H+4,D/2+EYE),`눈까지 ${Math.round(D/2+EYE-mainZ)}`,true);
  }

  /* info for checks */
  items.updateMatrixWorld(true);
  const itemBox=new THREE.Box3().setFromObject(items);
  deskG.updateMatrixWorld(true);const deskBox=room?new THREE.Box3(V(room.xl,0,room.zb),V(room.xr,S.deskH,room.zf)):new THREE.Box3().setFromObject(deskG);
  root.updateMatrixWorld(true);const allBox=new THREE.Box3();[deskG,items,extra].forEach(o=>allBox.expandByObject(o));
  info={room,allBox,deskBox,main,mainZ,mainCY,monBox,itemBox,kb,kbZ,mons,curved};
  updateCards();renderChecks();
}
let pending=false;function schedule(){if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;build()})}

/* ---------- cards & checks ---------- */
function updateCards(){
  const m=info.main,spec=MONITORS[S.mon];
  $('#cDesk').textContent=`${S.deskW} × ${S.deskD}`;
  $('#cDeskS').textContent=`DESK / H ${S.deskH} mm${S.extraDesks.length?` · +${S.extraDesks.length} DESK`:''}${S.drawers.length?` · ${S.drawers.length} DRAWER`:''}`;
  $('#cMon').textContent=`${Math.round(m.w)} × ${Math.round(m.h)}`;
  $('#cMonS').textContent=`${spec.short}${info.curved?' CURVED':''}${S.mount==='armLap'?` + LAPTOP ${S.lapSize}"`:''}${S.subCount?` + ${MONITORS[S.sub].short}×${S.subCount}`:''} / mm`;
}
function eyeY(){const H=S.userH*10;return S.deskH>=900?.936*H:S.deskH+.295*H}
function renderChecks(){
  const {deskW:W,deskD:D,deskH:H}=S,{main,mainZ,mainCY,monBox,itemBox,kb,kbZ}=info,out=[];
  const standing=S.deskH>=900;
  // 1 width
  const l=Math.round(itemBox.min.x+W/2),r=Math.round(W/2-itemBox.max.x),span=Math.round(monBox.max.x-monBox.min.x);
  out.push({t:'좌우 여유',v:l<0||r<0?'책상 밖으로 나가요':`왼쪽 ${l} · 오른쪽 ${r} mm`,s:l<0||r<0?'bad':Math.min(l,r)<60?'warn':'ok',n:`모니터 전체 폭 ${span}mm / 책상 ${W}mm`});
  // 2 viewing distance
  const dist=Math.round(D/2+EYE-mainZ),ph=main.h,lo=Math.round(ph*2/10)*10,hi=Math.round(ph*2.6/10)*10;
  let s2='ok',n2=`권장 ${lo}~${hi}mm`;
  if(dist<lo){s2=dist<lo-120?'bad':'warn';n2+=` · ${lo-dist}mm 더 떨어지면 좋아요`}else if(dist>hi){s2='warn';n2+=` · 조금 멀어요`}
  out.push({t:'눈 ↔ 화면 거리',v:`약 ${dist} mm`,s:s2,n:n2});
  // 3 depth: keyboard vs monitor/stand
  const obstacle=mainZ+(S.mount==='stand'?Math.max(0,main.standFront||0):0);
  const kbBack=kb?kbZ-kb.d/2:D/2-160;
  const gap=Math.round(kbBack-obstacle);
  const standOut=S.mount==='stand'?Math.round(-D/2-(mainZ+main.standBack)):-1;
  if(standOut>0)out.push({t:'모니터 스탠드',v:`뒤로 ${standOut}mm 튀어나옴`,s:'bad',n:'화면 위치를 앞으로 당기거나 모니터암을 고려하세요'});
  else out.push({t:kb?'키보드 ↔ 모니터 간격':'모니터 앞 공간',v:gap<0?'겹쳐요':`${gap} mm`,s:gap<0?'bad':gap<60?'warn':'ok',n:gap<60?'키보드를 쓰기 빠듯해요':S.mount==='stand'?'스탠드 받침 앞까지 기준':'화면 앞면 기준'});
  // 4 screen height
  const top=Math.round(mainCY+main.h/2+main.bz),eye=Math.round(eyeY()),diff=top-eye;
  out.push({t:'화면 위쪽 vs 눈높이',v:diff>=0?`눈보다 ${diff}mm 위`:`눈보다 ${-diff}mm 아래`,s:diff>30?'warn':diff<-180?'warn':'ok',n:diff>30?'고개를 들게 돼요. 모니터를 낮춰보세요':diff<-180?'고개를 숙이게 돼요. 모니터를 올려보세요':'화면 위쪽이 눈높이 근처면 좋아요'});
  // 5 desk height
  const ideal=Math.round((standing?.63:.41)*S.userH*10/5)*5;
  out.push({t:standing?'서서 쓰는 책상 높이':'책상 높이',v:`${H} mm`,s:Math.abs(H-ideal)<=30?'ok':'warn',n:`키 ${S.userH}cm 기준 권장 약 ${ideal}mm`});
  // 6 FOV
  const ang=Math.round((Math.atan2(-monBox.min.x,dist)+Math.atan2(monBox.max.x,dist))*180/Math.PI);
  out.push({t:'화면이 차지하는 시야',v:`좌우 약 ${ang}°`,s:ang>110?'warn':'info',n:ang>110?'고개를 많이 돌려야 해요':ang>70?'몰입감 높음 · 고개를 조금 돌려요':'눈만 움직여도 다 보여요'});
  if(info.room){
    const rm=info.room,b=info.allBox,out1=b.min.x<rm.xl-1||b.max.x>rm.xr+1||b.min.z<rm.zb-1||b.max.z>rm.zf+1;
    const aisle=Math.round(rm.zf-D/2);
    if(out1)out.push({t:'방',v:'방 밖으로 나가요',s:'bad',n:'책상 위치나 방 크기를 조정해 보세요'});
    out.push({t:'책상 앞 공간 (의자·통로)',v:`${aisle} mm`,s:aisle<750?'bad':aisle<1000?'warn':'ok',n:aisle<750?'의자를 빼기 어려워요':aisle<1000?'의자는 되지만 지나가기 빠듯해요':'의자 뒤로 지나다닐 수 있어요'});
  }
  if(S.drawers.length){
    const clear=S.deskH-25-40,under=S.drawers.map((e,i)=>({e,i})).filter(o=>o.e.where.startsWith('under'));
    const tooTall=under.filter(o=>o.e.h>clear);
    const legs=Math.round(W-190-under.reduce((a,o)=>a+o.e.w,0));
    if(tooTall.length)out.push({t:'서랍장',v:`서랍장 ${tooTall.map(o=>o.i+1).join(', ')} 안 들어가요`,s:'bad',n:`책상 밑 높이는 약 ${clear}mm예요 (서랍장 ${tooTall.map(o=>o.e.h).join('/')}mm)`});
    else if(under.length)out.push({t:'책상 밑 다리 공간',v:`폭 ${legs} mm`,s:legs<550?'bad':legs<650?'warn':'ok',n:`서랍장이 책상 밑에 들어가요 (여유 높이 ${clear-Math.max(...under.map(o=>o.e.h))}mm)`});
    else out.push({t:'서랍장',v:`${S.drawers.length}개 · 책상 옆`,s:'info',n:'옆 서랍장은 위에 물건을 올려두기 좋아요'});
  }
  $('#checks').innerHTML=out.map(c=>`<div class="ck ${c.s}"><div class="t">${c.t}</div><div class="v">${c.v}</div><div class="n">${c.n}</div></div>`).join('');
}

/* ---------- camera ---------- */
let camAnim=null,curView='iso';
function setView(name,instant){
  curView=name;document.querySelectorAll('#views button').forEach(b=>b.classList.toggle('on',b.dataset.v===name));
  const {deskD:D,deskH:H}=S;let pos,tgt,fov=38;
  const db=info.deskBox,c=db.getCenter(V(0,0,0)),ext=Math.max(db.max.x-db.min.x,(db.max.z-db.min.z)*1.2),R=Math.max(2600,ext*(info.room?1.45:1.7)),cx=c.x,cz=c.z;
  if(name==='iso'){tgt=V(cx,H*.82,cz);pos=V(cx+R*.52,H+R*.5,cz+R*.8)}
  if(name==='front'){tgt=V(cx,H+220,-D*.1);pos=V(cx,H+650,R*.95)}
  if(name==='top'){tgt=V(cx,H,cz);pos=V(cx,R*1.2,cz+1)}
  if(name==='side'){tgt=V(cx,H*.8,cz);pos=V(cx+R*.95,H+350,cz)}
  if(name==='pov'){tgt=V(S.monX,info.mainCY-40,info.mainZ);pos=V(0,eyeY(),D/2+EYE);fov=58;setAuto(false)}
  if(instant){camera.position.copy(pos);controls.target.copy(tgt);camera.fov=fov;camera.updateProjectionMatrix();return}
  const p0=camera.position.clone(),t0=controls.target.clone(),f0=camera.fov,st=performance.now();
  camAnim=now=>{let k=Math.min(1,(now-st)/700);k=1-Math.pow(1-k,3);camera.position.lerpVectors(p0,pos,k);controls.target.lerpVectors(t0,tgt,k);camera.fov=f0+(fov-f0)*k;camera.updateProjectionMatrix();if(k>=1)camAnim=null};
}
function setAuto(v){controls.autoRotate=v;$('#auto').checked=v}
document.querySelectorAll('#views button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.v)));
$('#reset').addEventListener('click',()=>setView('iso'));
$('#auto').addEventListener('change',e=>setAuto(e.target.checked));

/* ---------- slots ---------- */
let memSlots={};
function getSlots(){try{return JSON.parse(localStorage.getItem('desksim-slots')||'null')||memSlots}catch(e){return memSlots}}
function putSlots(o){memSlots=o;try{localStorage.setItem('desksim-slots',JSON.stringify(o))}catch(e){}}
function summary(c){return `${c.deskW}×${c.deskD} · ${MONITORS[c.mon]?.short||''}${c.subCount?` + ${MONITORS[c.sub]?.short}×${c.subCount}`:''} · ${KB_NAME[c.kb]}${c.extraDesks&&c.extraDesks.length?` · 책상 ${c.extraDesks.length+1}개`:''}${c.drawers&&c.drawers.length?` · 서랍 ${c.drawers.length}`:''}${c.room?` · 방 ${c.roomW}×${c.roomD}`:''}${c.sets&&c.sets.length?` · 세트 ${c.sets.length}`:''}${c.pegs&&c.pegs.length?` · 타공판 ${c.pegs.length}`:''}`}
function renderSlots(){
  const sl=getSlots();
  $('#slots').innerHTML=['A','B','C'].map(k=>`<div class="slot"><button class="load ${sl[k]?'':'empty'}" data-k="${k}"><b>${k}</b>${sl[k]?summary(sl[k]):'비어 있음'}</button><button class="save" data-k="${k}">저장</button></div>`).join('');
  $('#slots').querySelectorAll('.load').forEach(b=>b.addEventListener('click',()=>{const c=getSlots()[b.dataset.k];if(!c)return;S={...DEFAULTS,...c,extraDesks:(c.extraDesks||[]).map(o=>({...o})),drawers:(c.drawers||[]).map(o=>({...o})),sets:(c.sets||[]).map(o=>({...o})),pegs:(c.pegs||[]).map(o=>({...o}))};refreshUI();renderExtra();renderDrawers();renderSets();renderPegs();build()}));
  $('#slots').querySelectorAll('.save').forEach(b=>b.addEventListener('click',()=>{const o={...getSlots()};o[b.dataset.k]=JSON.parse(JSON.stringify(S));putSlots(o);renderSlots()}));
}

/* ---------- loop ---------- */
function resize(){const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe(view);
function loop(now){requestAnimationFrame(loop);if(camAnim)camAnim(now);controls.update();
  for(const w of roomWalls)w.g.visible=camera.position.clone().sub(w.p).dot(w.n)>-1;renderer.render(scene,camera)}

renderPanel();renderExtra();renderDrawers();renderSets();renderPegs();refreshUI();renderSlots();build();setView('iso',true);resize();setAuto(true);requestAnimationFrame(loop);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>build());
})();
</script>
